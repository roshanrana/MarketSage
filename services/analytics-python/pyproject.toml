[project]
name = "marketsage-analytics"
version = "0.1.0"
description = "Python analytics core for MarketSage."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb>=1.3.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
  "pytz>=2025.2",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
live = ["openbb>=4.4.0"]
models = ["transformers>=4.46.0"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsage_api", "src/marketsage_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
